<div class="flex flex-col gap-5 justify-between md:flex-row my-15">
  <div class="flex justify-start items-center gap-3  md:justify-center  ">
    <label for="search-by" class="text-sm">Buscar por nombre:</label>
    <input type="text" id="search-by" class="border rounded-sm px-2 w-40 md:w-60" autofocus [formControl]="searchByName">
  </div>

  <div class="flex items-center gap-3">
    <label for="select" class="text-sm">Filtrar por:</label>
    <select name="filterBy" id="select" class="border rounded-sm" (change)="onFilterChange(selectValue.value)" #selectValue>
      <option value="1" class="text-black">--seleccione--</option>
      <option value="1" class="text-black">Todos</option>
      <option value="2" class="text-black">Habilitado</option>
      <option value="3" class="text-black">Inhabilitado</option>
    </select>
  </div>
</div>
