<section class="flex flex-col flex-1  ">
  <h1 class="text-4xl md:text-4xl text-center my-6 md:my-10 font-bold">Lista de Productos</h1>


  <div class="flex flex-col md:flex-row md:justify-between md:items-center mt-15">
    <div class="flex justify-center md:justify-start md:w-1/2 items-center">
      <a type="button" routerLink="form"
        class="bg-blue-600 hover:bg-blue-700 text-white w-full md:w-fit text-center px-6 py-2 rounded-md transition-colors">
        Crear Producto
      </a>
    </div>

    <admin-filter-bar class="w-full" (searchByNameValueEmitter)="searchByNameResult.set($event)"
      (filterSelectionEmitter)="filterSelection.set($event)">
    </admin-filter-bar>
  </div>


  <!-- paginator -->
  @if (productsResource.value()?.totalElements! > 0) {
  <div class="flex justify-center">
    <paginator [totalPages]="productsResource.value()?.totalPages" [currentPage]="productsResource.value()?.page" />
  </div>
  }


  @if (productsResource.isLoading()) {
  <loading-dots />
  }
  @else if (productsResource.value()?.content?.length == 0) {
  <div class="flex flex-col items-center mt-10">
    <p class="text-red-400 text-sm bg-red-50 px-4 py-2 rounded-lg border border-red-100">
      No se encontraron productos
    </p>
  </div>
  }
  @else {
  <div class="flex-1">

    <!-- table desktop -->
    <div class="hidden md:block">
      <products-table [products]="productsResource.value()?.content" (onDelete)="eliminarProducto($event)" />
    </div>

    <!-- table mobile -->
    <div class="md:hidden">
      <products-table-mobile [products]="productsResource.value()?.content" (onDelete)="eliminarProducto($event)" />
    </div>

  </div>
  }

  <!-- paginator -->
  @if (productsResource.value()?.totalElements! > 0) {
  <div class="flex justify-center mt-8 mb-10">
    <paginator [totalPages]="productsResource.value()?.totalPages" [currentPage]="productsResource.value()?.page" />
  </div>
  }
</section>
